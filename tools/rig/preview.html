<!doctype html><meta charset="utf-8"><title>BONK rig preview</title>
<style>body{margin:0;background:#4b7d3a;font:13px system-ui;color:#fff}canvas{display:block;background:linear-gradient(#7ec8ff,#bfe6ff 60%,#5da03c 60%)}#ui{position:fixed;top:8px;left:8px;background:#0008;padding:8px;border-radius:8px}label{display:block}</style>
<canvas id="c" width="1200" height="600"></canvas>
<div id="ui">
<label>speed <input id="sp" type="range" min="-1.3" max="1.3" step=".01" value=".8"> <span id="spv"></span></label>
<label>state <select id="st"><option>run<option>idle<option>yay<option>bonk<option>dizzy<option>celebrate</select></label>
<label>hop <input id="hop" type="range" min="0" max="120" value="0"></label>
<label>look <input id="lx" type="range" min="-1" max="1" step=".05" value="0"> <input id="ly" type="range" min="-1" max="1" step=".05" value="0"></label>
<label><input id="bones" type="checkbox"> show anchors</label>
</div>
<base href="../../"><script src="src/core/config.js"></script><script src="src/core/events.js"></script><script src="src/core/assets.js"></script><script src="src/game/rig.js"></script>
<script>
const c=document.getElementById('c').getContext('2d'); const $=s=>document.querySelector(s);
Assets.load(()=>{}).then(()=>{ let last=performance.now(); let x=300, face=1;
  function f(now){ const dt=Math.min(.05,(now-last)/1000); last=now;
    const speed=+$('#sp').value; $('#spv').textContent=speed.toFixed(2); if(Math.abs(speed)>.05) face=Math.sign(speed);
    const I={speed:Math.abs(speed), face, state:$('#st').value, hop:+$('#hop').value, lookX:+$('#lx').value, lookY:+$('#ly').value};
    Rig.update(dt,I);
    c.clearRect(0,0,1200,600);
    const gy=430, H=300;
    // treadmill ground marks to check foot-slide: marks move at speed × max (px/s). max = 1.05 stage widths/s → here 500 px/s
    const sc=(window.__s=(window.__s||0)+speed*500*dt);
    c.strokeStyle='#3c7a24'; c.lineWidth=3; for(let k=-2;k<14;k++){ const mx=((k*100 - sc)%1400+1400)%1400-100; c.beginPath(); c.moveTo(mx,gy); c.lineTo(mx,gy+18); c.stroke(); }
    c.fillStyle='#0003'; c.beginPath(); c.ellipse(600,gy+4,H*.42,H*.06,0,0,6.28); c.fill();
    Rig.draw(c,600,gy,H,face,I);
    // second copy small (game size ~ 88 px)
    Rig.draw(c,1050,gy,88,face,I);
    if($('#bones').checked){ c.fillStyle='#f0f'; c.fillRect(598,gy-2,4,4); }
    requestAnimationFrame(f);} requestAnimationFrame(f); });
</script>
